spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:seatsync_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiration-ms: 60000 # 1 minute for test
    refresh-token-expiration-ms: 3600000 # 1 hour for test
    issuer: SeatSync-AI-Test

logging:
  level:
    root: INFO
    com.seatsync: DEBUG

